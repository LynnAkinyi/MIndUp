<!DOCTYPE html>
<html>

<head>
    <title>Task Progress</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        
        .cta-button {
            display: inline-block;
            padding: 4px 12px;
            font-size: 1.2em;
            text-decoration: none;
            background-color: #e5cfbe;
            color: #6a2d0a;
            border-radius: 20px;
            transition: background-color 0.3s, color 0.3s;
            margin-top: 40px;
        }
        
        .cta-button:hover {
            color: #fff;
            border-radius: 30px;
            background: #6a2d0a;
        }
    </style>
</head>

<body>
    <h1>Task Progress</h1>

    <form id="taskForm">
        <h2>Movement Task</h2>
        <label>
      <input type="radio" name="task1" value="0" checked> Incomplete
    </label>
        <label>
      <input type="radio" name="task1" value="2"> 1/4 Done
    </label>
        <label>
      <input type="radio" name="task1" value="5"> 1/2 Done
    </label>
        <label>
      <input type="radio" name="task1" value="7"> 3/4 Done
    </label>
        <label>
      <input type="radio" name="task1" value="10"> Complete
    </label>
        <label>
      <input type="checkbox" name="bonus1"> Bonus
    </label>

        <h2>Mindfullness Task</h2>
        <label>
      <input type="radio" name="task2" value="0" checked> Incomplete
    </label>
        <label>
      <input type="radio" name="task2" value="2"> 1/4 Done
    </label>
        <label>
      <input type="radio" name="task2" value="5"> 1/2 Done
    </label>
        <label>
      <input type="radio" name="task2" value="7"> 3/4 Done
    </label>
        <label>
      <input type="radio" name="task2" value="10"> Complete
    </label>
        <label>
      <input type="checkbox" name="bonus2"> Bonus
    </label>

        <button type="submit" class="cta-button">Update Progress</button>

        <canvas class="container" id="progressChart" style="width:70%;max-width:700px; height:200px;"></canvas>
    </form>

    <script>
        var ctx = document.getElementById('progressChart').getContext('2d');
        var taskLevels = {
            task1: 0,
            task2: 0
        };
        var bonusValues = {
            bonus1: 0,
            bonus2: 0
        };

        var progressChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Task 1', 'Task 2'],
                datasets: [{
                    label: 'Progress',
                    data: [taskLevels.task1, taskLevels.task2],
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.2)',
                        'rgba(54, 162, 235, 0.2)'
                    ],
                    borderColor: [
                        'rgba(255, 99, 132, 1)',
                        'rgba(54, 162, 235, 1)'
                    ],
                    borderWidth: 1
                }, {
                    label: 'Bonus',
                    data: [bonusValues.bonus1, bonusValues.bonus2],
                    backgroundColor: [
                        'rgba(255, 206, 86, 0.2)',
                        'rgba(255, 206, 86, 0.2)'
                    ],
                    borderColor: [
                        'rgba(255, 206, 86, 1)',
                        'rgba(255, 206, 86, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 15
                    }
                }
            }
        });

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    // Does this cookie string begin with the name we want?
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        document.getElementById('taskForm').addEventListener('submit', function(event) {
            event.preventDefault();

            var task1Level = document.querySelector('input[name="task1"]:checked').value;
            var task2Level = document.querySelector('input[name="task2"]:checked').value;
            var bonus1Checked = document.querySelector('input[name="bonus1"]').checked;
            var bonus2Checked = document.querySelector('input[name="bonus2"]').checked;

            taskLevels.task1 = task1Level;
            taskLevels.task2 = task2Level;
            bonusValues.bonus1 = bonus1Checked ? 5 : 0;
            bonusValues.bonus2 = bonus2Checked ? 5 : 0;

            progressChart.data.datasets[0].data = [taskLevels.task1, taskLevels.task2];
            progressChart.data.datasets[1].data = [bonusValues.bonus1, bonusValues.bonus2];
            progressChart.update();

            // Send a POST request to the Django view
            fetch('/update_progress/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: new URLSearchParams({
                        'task1': task1Level,
                        'task2': task2Level,
                        'bonus1': bonus1Checked,
                        'bonus2': bonus2Checked
                    })
                }).then(response => response.json())
                .then(data => console.log(data));
        });

        window.onload = function() {
            fetch('/get_progress/')
                .then(response => response.json())
                .then(data => {
                    if (data.task1) {
                        document.querySelector(`input[name="task1"][value="${data.task1}"]`).checked = true;
                        taskLevels.task1 = data.task1;
                    }
                    if (data.task2) {
                        document.querySelector(`input[name="task2"][value="${data.task2}"]`).checked = true;
                        taskLevels.task2 = data.task2;
                    }
                    if (data.bonus1) {
                        document.querySelector('input[name="bonus1"]').checked = data.bonus1;
                        bonusValues.bonus1 = data.bonus1 ? 5 : 0;
                    }
                    if (data.bonus2) {
                        document.querySelector('input[name="bonus2"]').checked = data.bonus2;
                        bonusValues.bonus2 = data.bonus2 ? 5 : 0;
                    }

                    // Update chart data
                    progressChart.data.datasets[0].data = [taskLevels.task1, taskLevels.task2];
                    progressChart.data.datasets[1].data = [bonusValues.bonus1, bonusValues.bonus2];
                    progressChart.update();
                });
        };
    </script>
</body>

</html>
