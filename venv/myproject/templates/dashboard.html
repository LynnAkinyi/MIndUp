{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js">
    </script>
    <title>Dashboard</title>
    <style>
        .sidenav {
            height: 100%;
            width: 200px;
            position: fixed;
            z-index: 1;
            top: 0px;
            left: 0;
            background-color: #A79589;
            overflow-x: hidden;
            padding-top: 10px;
            border-radius: 0px 10px 10px 0px;
        }
        
        .sidenav a {
            padding: 10px;
            margin: 20px 20px 20px 30px;
            display: block;
            text-decoration: none;
            text-decoration: none;
            font-size: 18px;
            color: #8A441D;
            display: block;
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.4));
        }
        
        .sidenav a:hover {
            color: #f1f1f1;
        }
        
        .dashlinks a {
            margin-top: 50px;
            display: flex;
            align-items: center;
        }
        
        .logout a {
            display: flex;
            align-items: center;
            margin-top: 150px;
        }
        
        .material-icons {
            color: #8A441D;
            font-size: 28px;
            cursor: pointer;
            margin-right: 15px;
            /* Adjusted margin */
        }
        
        footer {
            background-color: #A79589;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-bottom: 0;
            width: 100%;
        }
        
        .main {
            margin-left: 140px;
            /* Same as the width of the sidenav */
            padding: 0px 10px;
        }
        
        .main h2 {
            margin-top: 50px;
            margin-bottom: 10px;
        }
        
        .row {
            display: flex;
            justify-content: space-between;
            margin-left: 50px;
            height: 250px;
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.4));
        }
        
        .column {
            flex: 1;
            margin: 10px;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 10px;
            overflow-y: auto;
            background-color: #fff6f2;
        }
        
        .highlight {
            background-color: yellow;
        }
        
        a {
            text-decoration: none;
            color: black;
        }
        /* Add this to your style tag */
        
        ul {
            list-style-type: square;
            /* Use 'tick' for ticks */
        }
        
        .selected-dates {
            top: 0px;
            max-height: 100px;
        }
        
        .topnav {
            background-color: #A79589;
            overflow: hidden;
            padding: 20px;
            margin: 10px 0 0 220px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.2));
        }
        
        .main h2 {
            margin-left: 10cqmin;
            margin-bottom: 20px;
        }
        
        .topnav input[type="text"] {
            width: 300px;
            padding: 10px;
            border-radius: 30px;
            border: none;
            margin-left: 5%;
            margin-right: 50%;
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.2));
            /* Adjusted margin */
        }
        /* Media query for mobile */
        
        .dropdownNav {
            display: none;
            position: absolute;
            width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
        }
        
        .dropdownNav a {
            display: block;
            text-align: left;
            padding: 12px 16px;
        }
        
        .styled-button {
            background-color: #8A441D;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }
        /* CSS */
        
        .active {
            color: #8A441D;
            background-color: rgba(255, 246, 242, 0.4);
            border-radius: 40px;
        }
        
        .date-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .date-item .delete-btn {
            margin-left: 10px;
        }
        
        @media (max-width: 600px) {
            .sidenav {
                position: relative;
                width: 100%;
                height: auto;
                padding: 10px;
            }
            .sidenav a {
                float: left;
                width: 100%;
                text-align: center;
            }
            .topnav {
                padding: 10px;
                margin: 0;
            }
            .topnav input[type="text"] {
                width: 100%;
                margin: 0 0 10px 0;
            }
            .main {
                margin-left: 0;
            }
            .main h2 {
                text-align: center;
            }
            .row {
                margin-left: 0;
                height: auto;
                flex-direction: column;
            }
            .row a {
                text-decoration: none;
                color: black;
            }
            .column {
                margin: 10px 0;
                width: 100%;
            }
            .sidenav {
                display: none;
            }
            <!-- .mobile-nav {
                display: flex;
                flex-direction: column;
                margin: 10px;
                padding: 20px;
                border-radius: 20px;
                background-color: rgba(75, 51, 3, 0.282)
            }
            -->.topnav input[type="text"] {
                align-self: flex-start;
            }
        }
    </style>
</head>

<body>
    <!-- add side nav and style it -->
    <div class="sidenav">
        <div class="dashlinks">
            <a href="{% url 'dashboard' %}" class="active" id="dashboardLink"><span class="material-icons">dashboard</span>Dashboard</a>


            <a href="{% url 'community' %}"><span class="material-icons">
groups
</span>Community</a>
            <a href="{% url 'blog' %}"><span class="material-icons">
edit_note
</span>Blog</a>
            <a href="{% url 'about' %}"><span class="material-icons">
description
</span>About Us</a>
            <a href="{% url 'tasks' %}"><span class="material-icons">
task
</span>Tasks</a>
        </div>
        <div class="logout"> <a href="{% url 'logout' %} "><span class="material-icons">
logout
</span>Logout</a></div>


    </div>
    <!-- <div class="mobile-nav">


        <div id="dropdownNav" class="dropdownNav">
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Community</a>
            <a href="#">Blog</a>
        </div>

    </div> -->

    <!-- add top navigation bar -->
    <div class="topnav">
        <input type="text" id="searchInput" placeholder="Search...">

        <span class="material-icons" id="notificationIcon">
    notifications
</span>
        <div id="notificationDropdown" style="display: none;">
            <!-- Add your notifications here -->
        </div>
        <a href="{% url 'profile' %}">
            <span class="material-icons">person</span>
        </a>


        <!-- <span class="material-icons">
menu
</span> -->
    </div>

    <!-- add main content -->
    <div class="main">
        <h2>Hello, {{ request.user.username }}, Welcome Back!</h2>
        <!-- Add this inside your .main div -->
        <div class="row">
            <div class="column"><b><i>Member Overview</i></b>
                <div class="saved-info" id="saved-info">

                    <div class="dashboard-info" id="dashboard-info"></div>
                </div>

            </div>
            <div class="column"><b><i>Upcoming Events</i></b>
                <div class="selected-dates">
                    <ul id="upcoming-events"></ul>
                </div>
            </div>

            <a href="book.html">
                <div class="column" id="appointment"><b><i>Scheduled Appointments</i></b></a>
            <div class="selected-dates">
                <ul id="selectedDatesList"></ul>
            </div>

            </div>

        </div>
        <div class="row">
            <div class="column"><b><i>Progress</i></b>
                <canvas id="myChart" style="width:100%;max-width:700px;"></canvas>
            </div>
            <div class="column"><b><i>What's new</i></b>
                <canvas id="myChart" style="width:100%;max-width:700px;"></canvas>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('notificationIcon').addEventListener('click', function() {
            var dropdown = document.getElementById('notificationDropdown');
            dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        });
        document.getElementById('searchInput').addEventListener('keyup', function(event) {
            // Number 13 is the "Enter" key on the keyboard
            if (event.keyCode === 13) {
                // Cancel the default action, if needed
                event.preventDefault();
                // Trigger the search function
                search();
            }
        });

        function search() {
            // Get the search query from the input field
            var query = document.getElementById('searchInput').value.trim().toLowerCase();

            // Get the content to search
            var contentToSearch = Array.from(document.querySelectorAll('.dashlinks a, .main h2, .main b, #dashboard-info, #upcoming-events, #selectedDatesList'));

            // Remove previous highlights
            contentToSearch.forEach(function(item) {
                item.innerHTML = item.innerHTML.replace(/<span class="highlight">([^<]*)<\/span>/g, '$1');
            });

            // Loop through each content item and check if it matches the search query
            contentToSearch.forEach(function(item) {
                var textContent = item.textContent.toLowerCase();
                if (textContent.includes(query)) {
                    // If the item matches the search query, highlight it
                    var regex = new RegExp('(' + query + ')', 'gi');
                    item.innerHTML = item.innerHTML.replace(regex, '<span class="highlight">$1</span>');
                }
            });
        }
        // Check if values exist in local storage and display them
        window.addEventListener('load', function() {
            var userProfile = localStorage.getItem('userProfile');
            if (userProfile) {
                var userData = JSON.parse(userProfile);
                var name = userData.name;
                var email = userData.email;
                var phone = userData.phone;
                var profilePictureUrl = userData.profilePictureUrl;

                var dashboardInfoDiv = document.getElementById('dashboard-info');
                dashboardInfoDiv.innerHTML = '<p><strong>Name:</strong> ' + name + '</p>' +
                    '<p><strong>Email:</strong> ' + email + '</p>' +
                    '<p><strong>Phone:</strong> ' + phone + '</p>' +
                    '<p><strong>Profile Picture:</strong> <img src="' + profilePictureUrl + '" alt="Profile Picture"></p>';

                // Show saved information
                var savedInfoDiv = document.getElementById('saved-info');
                savedInfoDiv.style.display = 'block';
            }
        });
        // JavaScript


        // Retrieve the date from the query parameters in the URL
        const selectedDates = JSON.parse(localStorage.getItem('selectedDates')) || [];

        // Function to schedule an appointment and redirect to dashboard
        function scheduleAppointment() {
            const selectedDate = document.getElementById('appointmentDate').value;
            if (selectedDate) {
                // Retrieve existing selected dates from local storage or initialize an empty array
                let selectedDates = JSON.parse(localStorage.getItem('selectedDates')) || [];

                // Add the new selected date to the array
                selectedDates.push(selectedDate);

                // Store the updated array back in local storage
                localStorage.setItem('selectedDates', JSON.stringify(selectedDates));

                // Redirect to the dashboard page
                window.location.href = 'dashboard.html';
            }
        }

        // Display selected dates in the dashboard
        window.onload = function() {
            const dashboardLink = document.getElementById('dashboardLink');
            dashboardLink.classList.add('active');
            const appointmentDiv = document.getElementById('appointment');
            const ul = document.createElement('ul');

            selectedDates.forEach(date => {
                const li = document.createElement('li');

                li.classList.add('date-item');

                const dateSpan = document.createElement('span'); // Create a span for the date text
                dateSpan.textContent = date;
                li.appendChild(dateSpan);

                const deleteBtn = document.createElement('span');
                deleteBtn.classList.add('material-icons', 'delete-btn');
                deleteBtn.textContent = 'delete';
                deleteBtn.addEventListener('click', function() {
                    li.remove(); // Remove the date from the list
                    // Update selectedDates array in local storage
                    const updatedDates = selectedDates.filter(d => d !== date);
                    localStorage.setItem('selectedDates', JSON.stringify(updatedDates));
                });

                li.appendChild(deleteBtn); // Add delete button to the list item
                ul.appendChild(li); // Add list item to the unordered list
            });

            appointmentDiv.appendChild(ul); // Add unordered list to the appointment div

            const upcomingEventsDiv = document.getElementById('upcoming-events');

            // Clear the existing content of the div
            upcomingEventsDiv.innerHTML = '';

            // Check if there are at least two selected dates
            if (selectedDates.length >= 2) {
                const sortedDates = selectedDates.sort(); // Sort the dates

                for (let i = 0; i < sortedDates.length - 1; i++) {
                    const currentDate = new Date(sortedDates[i]);
                    const nextDate = new Date(sortedDates[i + 1]);

                    // Calculate the difference in days between the current date and the next date
                    const timeDifference = Math.abs(nextDate.getTime() - currentDate.getTime());
                    const dayDifference = Math.ceil(timeDifference / (1000 * 3600 * 24));

                    // Check if the day difference is exactly one day
                    if (dayDifference === 1) {
                        const startDate = currentDate.toLocaleDateString(); // Get the start date
                        const eventListItem = document.createElement('li');
                        eventListItem.textContent = startDate;
                        upcomingEventsDiv.appendChild(eventListItem);
                    }
                }
            }
        };


        // Retrieve the tasks and bonuses from localStorage
        let tasks = JSON.parse(localStorage.getItem('tasks'));
        let bonuses = JSON.parse(localStorage.getItem('bonuses'));

        // Create the chart
        let myChart = new Chart("myChart", {
            type: "bar",
            data: {
                labels: tasks,
                datasets: [{
                    label: 'Progress Bonus',
                    data: bonuses,
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    yAxes: [{
                        ticks: {
                            beginAtZero: true,
                            max: 10
                        }
                    }]
                }
            }
        });

        // user_details.js
        document.getElementById('userDetailsForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            try {
                const response = await fetch('/api/user/details/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken') // Include CSRF token
                    },
                    body: JSON.stringify({
                        name,
                        email
                    })
                });
                if (response.ok) {
                    const userDetails = await response.json();
                    document.getElementById('userDetails').innerHTML = `
               
                <p>Name: ${userDetails.name}</p>
                <p>Email: ${userDetails.email}</p>
            `;
                } else {
                    console.error('Failed to save user details');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        // Function to get CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>

</html>
