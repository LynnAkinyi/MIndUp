{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js">
    </script>
    <title>Dashboard</title>
    <style>
        .sidenav {
            height: 100%;
            width: 200px;
            position: fixed;
            z-index: 1;
            top: 0px;
            left: 0;
            background-color: #A79589;
            overflow-x: hidden;
            padding-top: 20px;
        }
        
        .sidenav a {
            padding: 10px;
            margin: 20px 20px 20px 30px;
            display: block;
            text-decoration: none;
            text-decoration: none;
            font-size: 18px;
            color: #8A441D;
            display: block;
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.4));
        }
        
        .sidenav a:hover {
            color: #f1f1f1;
        }
        
        .dashlinks {
            margin-top: 50%;
            margin-bottom: 40%;
        }
        
        footer {
            background-color: #A79589;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-bottom: 0;
            width: 100%;
        }
        
        .main {
            margin-left: 140px;
            /* Same as the width of the sidenav */
            padding: 0px 10px;
        }
        
        .main h2 {
            margin-top: 50px;
            margin-bottom: 10px;
        }
        
        .row {
            display: flex;
            justify-content: space-between;
            margin-left: 50px;
            height: 250px;
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.4));
        }
        
        .column {
            flex: 1;
            margin: 10px;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 10px;
            overflow-y: auto;
            background-color: #fff6f2;
        }
        
        a {
            text-decoration: none;
            color: black;
        }
        /* Add this to your style tag */
        
        ul {
            list-style-type: square;
            /* Use 'tick' for ticks */
        }
        
        .selected-dates {
            top: 0px;
            max-height: 100px;
        }
        
        .progress-chart-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
        }
        
        .progress-chart {
            width: 60px;
            height: 80px;
            margin: 10px;
            display: inline-block;
        }
        
        .progress-circle {
            fill: none;
            stroke: #007bff;
            stroke-width: 10;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.5s;
        }
        
        .progress-circle-background {
            fill: none;
            stroke: #f3f3f3;
            stroke-width: 10;
        }
        
        .analysis-heading {
            margin: 20px;
            text-align: center;
        }
        
        .topnav {
            background-color: #A79589;
            overflow: hidden;
            padding: 20px;
            margin: 10px 0 0 220px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.2));
        }
        
        .main h2 {
            margin-left: 10cqmin;
            margin-bottom: 20px;
        }
        
        .topnav input[type="text"] {
            width: 300px;
            padding: 10px;
            border-radius: 10px;
            border: none;
            margin-left: 5%;
            margin-right: 50%;
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.2));
            /* Adjusted margin */
        }
        
        .material-icons {
            color: #8A441D;
            font-size: 28px;
            cursor: pointer;
            margin-right: 10px;
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.2));
            /* Adjusted margin */
        }
        /* Media query for mobile */
        
        .dropdownNav {
            display: none;
            position: absolute;
            width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
        }
        
        .dropdownNav a {
            display: block;
            text-align: left;
            padding: 12px 16px;
        }
        
        .styled-button {
            background-color: #8A441D;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }
        
        a.active {
            /* Your active link styles here */
            font-weight: bold;
            /* For example, make the text bold */
            color: blue;
            /* Change the color */
            text-decoration: underline;
            /* Add underline */
        }
        
        @media (max-width: 600px) {
            .sidenav {
                position: relative;
                width: 100%;
                height: auto;
                padding: 10px;
            }
            .sidenav a {
                float: left;
                width: 100%;
                text-align: center;
            }
            .topnav {
                padding: 10px;
                margin: 0;
            }
            .topnav input[type="text"] {
                width: 100%;
                margin: 0 0 10px 0;
            }
            .main {
                margin-left: 0;
            }
            .main h2 {
                text-align: center;
            }
            .row {
                margin-left: 0;
                height: auto;
                flex-direction: column;
            }
            .row a {
                text-decoration: none;
                color: black;
            }
            .column {
                margin: 10px 0;
                width: 100%;
            }
            .sidenav {
                display: none;
            }
            <!-- .mobile-nav {
                display: flex;
                flex-direction: column;
                margin: 10px;
                padding: 20px;
                border-radius: 20px;
                background-color: rgba(75, 51, 3, 0.282)
            }
            -->.topnav input[type="text"] {
                align-self: flex-start;
            }
        }
    </style>
</head>

<body>
    <!-- add side nav and style it -->
    <div class="sidenav">
        <div class="dashlinks">
            <a href="dashboard.html"><span class="material-icons">
dashboard
</span>Dashboard</a>

            <a href="{% url 'community' %}"><span class="material-icons">
groups
</span>Community</a>
            <a href="{% url 'blog' %}"><span class="material-icons">
edit_note
</span>Blog</a>
            <a href="{% url 'about' %}"><span class="material-icons">
description
</span>About Us</a></div>
        <a href="{% url 'logout' %} "><span class="material-icons">
logout
</span>Logout</a>
    </div>
    <!-- <div class="mobile-nav">


        <div id="dropdownNav" class="dropdownNav">
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Community</a>
            <a href="#">Blog</a>
        </div>

    </div> -->

    <!-- add top navigation bar -->
    <div class="topnav">
        <input type="text" placeholder="Search...">

        <span class="material-icons">
            notifications
        </span>

        <a href="{% url 'profile' %}"><span class="material-icons">
person
</span></a>

        <!-- <span class="material-icons">
menu
</span> -->
    </div>

    <!-- add main content -->
    <div class="main">
        <h2>Hello, {{ request.user.username }}, Welcome Back!</h2>
        <!-- Add this inside your .main div -->
        <div class="row">
            <div class="column"><b><i>Member Overview</i></b>
                <div id="userDetails"></div>
                <form id="userDetailsForm">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required><br><br>
                    <label for="email">Email:</label>
                    <input type="email" id="email" required><br><br>
                    <button type="submit" class="styled-button">Save</button>
                </form>


            </div>
            <div class="column"><b><i>Upcoming Events</i></b>
                <div class="selected-dates">
                    <ul id="upcoming-events"></ul>
                </div>
            </div>

            <a href="book.html">
                <div class="column" id="appointment"><b><i>Scheduled Appointments</i></b></a>
            <div class="selected-dates">
                <ul id="selectedDatesList"></ul>
            </div>

            </div>

        </div>
        <div class="row">
            <div class="column"><b><i>Progress</i></b>
                <canvas id="myChart" style="width:100%;max-width:700px;"></canvas>
            </div>
            <div class="column"><b><i>What's new</i></b></div>
        </div>
    </div>
    <script>
        // Retrieve the date from the query parameters in the URL
        const selectedDates = JSON.parse(localStorage.getItem('selectedDates')) || [];

        // Function to schedule an appointment and redirect to dashboard
        function scheduleAppointment() {
            const selectedDate = document.getElementById('appointmentDate').value;
            if (selectedDate) {
                // Retrieve existing selected dates from local storage or initialize an empty array
                let selectedDates = JSON.parse(localStorage.getItem('selectedDates')) || [];

                // Add the new selected date to the array
                selectedDates.push(selectedDate);

                // Store the updated array back in local storage
                localStorage.setItem('selectedDates', JSON.stringify(selectedDates));

                // Redirect to the dashboard page
                window.location.href = 'dashboard.html';
            }
        }

        // Display selected dates in the dashboard
        window.onload = function() {
            const appointmentDiv = document.getElementById('appointment');
            const ul = document.createElement('ul');

            selectedDates.forEach(date => {
                const li = document.createElement('li');
                li.textContent = date;

                const deleteBtn = document.createElement('span');
                deleteBtn.classList.add('material-icons', 'delete-btn');
                deleteBtn.textContent = 'delete';
                deleteBtn.addEventListener('click', function() {
                    li.remove(); // Remove the date from the list
                    // Update selectedDates array in local storage
                    const updatedDates = selectedDates.filter(d => d !== date);
                    localStorage.setItem('selectedDates', JSON.stringify(updatedDates));
                });

                li.appendChild(deleteBtn); // Add delete button to the list item
                ul.appendChild(li); // Add list item to the unordered list
            });

            appointmentDiv.appendChild(ul); // Add unordered list to the appointment div

            const upcomingEventsDiv = document.getElementById('upcoming-events');

            // Clear the existing content of the div
            upcomingEventsDiv.innerHTML = '';

            // Check if there are at least two selected dates
            if (selectedDates.length >= 2) {
                const sortedDates = selectedDates.sort(); // Sort the dates

                for (let i = 0; i < sortedDates.length - 1; i++) {
                    const currentDate = new Date(sortedDates[i]);
                    const nextDate = new Date(sortedDates[i + 1]);

                    // Calculate the difference in days between the current date and the next date
                    const timeDifference = Math.abs(nextDate.getTime() - currentDate.getTime());
                    const dayDifference = Math.ceil(timeDifference / (1000 * 3600 * 24));

                    // Check if the day difference is exactly one day
                    if (dayDifference === 1) {
                        const startDate = currentDate.toLocaleDateString(); // Get the start date
                        const eventListItem = document.createElement('li');
                        eventListItem.textContent = startDate;
                        upcomingEventsDiv.appendChild(eventListItem);
                    }
                }
            }
        };


        const xValues = [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000];

        new Chart("myChart", {
            type: "line",
            data: {
                labels: xValues,
                datasets: [{
                    data: [860, 1140, 1060, 1060, 1070, 1110, 1330, 2210, 7830, 2478],
                    borderColor: "red",
                    fill: false
                }, {
                    data: [1600, 1700, 1700, 1900, 2000, 2700, 4000, 5000, 6000, 7000],
                    borderColor: "green",
                    fill: false
                }, {
                    data: [300, 700, 2000, 5000, 6000, 4000, 2000, 1000, 200, 100],
                    borderColor: "blue",
                    fill: false
                }]
            },
            options: {
                legend: {
                    display: false
                }
            }
        });

        // user_details.js
        document.getElementById('userDetailsForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            try {
                const response = await fetch('/api/user/details/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken') // Include CSRF token
                    },
                    body: JSON.stringify({
                        name,
                        email
                    })
                });
                if (response.ok) {
                    const userDetails = await response.json();
                    document.getElementById('userDetails').innerHTML = `
               
                <p>Name: ${userDetails.name}</p>
                <p>Email: ${userDetails.email}</p>
            `;
                } else {
                    console.error('Failed to save user details');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        // Function to get CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>

</html>
