{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url("{% static 'images/backdrop.png' %}");
            background-repeat: no-repeat;
            background-size: cover;
            font-family: Inter;
        }
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
            width: 50vw;
            margin: 10vh 25vw;
            background: #f6efe9;
            border-radius: 20px;
        }
        
        h2 {
            color: #6a2d0a;
            text-align-last: center;
        }
        
        .login-form {
            background: #f6efe9;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            /* Adjusted width for smaller screens */
            max-width: 500px;
            /* Set maximum width for better readability */
        }
        
        button {
            width: calc(100% - 40px);
            /* Adjusted width to fill container */
            background: #8a4c1d;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            margin: 15px 0;
            /* Adjusted margin */
            cursor: pointer;
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.2));
        }
        
        button:hover {
            background-color: #e5cfbe;
            color: #6a2d0a;
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.5));
        }
        
        .alternative-logins {
            margin-top: 20px;
        }
        
        .alternative-logins p {
            color: #8a4c1d;
        }
        
        .social-icons {
            display: flex;
            justify-content: center;
        }
        
        .google-icon,
        .twitter-icon,
        .facebook-icon {
            display: inline-block;
            width: 30px;
            height: 30px;
            margin: 0 5px;
            cursor: pointer;
            filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.2));
        }
        
        .google-icon {
            background: url("images/google.png") center/cover no-repeat;
        }
        
        .twitter-icon {
            background: url("images/twitter (1).png") center/cover no-repeat;
        }
        
        .facebook-icon {
            background: url("images/facebook.png") center/cover no-repeat;
        }
        
        a {
            text-decoration: none;
            color: #3c1b08;
        }
        
        a:hover {
            text-decoration: underline;
        }
        /* Media query for smaller screens */
        
        @media screen and (max-width: 600px) {
            .login-form {
                width: 90%;
                /* Adjusted width for smaller screens */
                max-width: 300px;
                /* Set maximum width for better readability */
            }
        }
    </style>
</head>

<body>
    <div class="login-container">

        <form method="POST">
            <h2>Sign Up</h2>
            {% csrf_token %} {{ form.as_p }}
            <button type="submit">Signup</button>
            <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
        </form>

    </div>
    <script>
        function signup() {
            // Sign up code...

            // Clear local storage
            localStorage.clear();

            // Redirect to the dashboard page
            window.location.href = 'dashboard.html';
        }
    </script>
</body>

</html>
