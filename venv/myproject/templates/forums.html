<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            font-family: Inter;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .chat-container {
            max-width: 80vw;
            margin: 0 auto;
            padding: 10px;
        }
        
        .chat-header {
            text-align: center;
            background-color: #8A441D;
            color: #fff;
            padding: 10px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        
        .chat-header h1 {
            font-size: 24px;
        }
        
        .chat-logout {
            text-align: right;
            padding: 10px;
        }
        
        .chat-logout a {
            text-decoration: none;
            color: #8A441D;
            font-weight: bold;
        }
        
        .chat-logout a:hover {
            text-decoration: underline;
        }
        
        .chat__item__container {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 10px;
            height: 300px;
            max-height: 300px;
            /* Set a maximum height for the chat container */
            overflow-y: auto;
            /* Add a vertical scrollbar when needed */
        }
        
        .chat-input-container {
            display: flex;
            align-items: center;
        }
        
        #id_message_send_input {
            flex: 1;
            /* Take up available space */
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        
        #id_message_send_button {
            padding: 5px 10px;
            background-color: #8A441D;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 5px;
        }
        
        .chat-message {
            background-color: #e4f9f5;
            border-radius: 10px;
            margin: 10px 0;
            padding: 10px;
            position: relative;
        }
        
        .chat-message.right {
            background-color: black;
            width: 80%;
            float: right;
            clear: both;
            margin-left: auto;
            margin-right: 0;
        }
        
        .chat-message.left {
            background-color: #8A441D;
            width: 80%;
            float: left;
            clear: both;
            margin-left: 0;
            margin-right: auto;
        }
        
        #volunteerButton,
        #createButton,
        #joinButton {
            display: inline-block;
            background-color: #8A441D;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .chat-message span {
            font-weight: bold;
            color: white;
        }
        
        .message-timestamp {
            font-size: 10px;
            position: absolute;
            top: 5px;
            right: 5px;
        }
        
        .message-username {
            font-size: 12px;
            position: absolute;
            bottom: 5px;
            right: 5px;
        }
        
        .sidenav {
            height: 100%;
            width: 200px;
            position: fixed;
            z-index: 1;
            top: 0px;
            left: 0;
            background-color: #A79589;
            overflow-x: hidden;
            padding-top: 20px;
            border-radius: 0px 20px 20px 0px;
        }
        
        .sidenav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .sidenav li {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #ccc;
            transition: background-color 0.3s ease;
        }
        
        .sidenav li:hover {
            background-color: #ccc;
        }
        
        .main {
            flex: 1;
            height: 100%;
            margin-left: 200px;
        }
        
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex: 1;
            border: 1px solid black;
            margin: 5px;
            text-align: center;
        }
        
        .container .volunteer,
        .container .groups,
        .container .chat-container {
            flex: 1;
            border: 1px solid black;
            margin: 5px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="group">
        <ul id="groupList">
            <h3>Groups</h3>
        </ul>
    </div>
    <div class="voluntee">
        <h3>Volunteers</h3>
        <ul id="volunteeList"></ul>
    </div>
    <button id="createButton">Create Group</button>
    <button>Join Group</button>
    <button id="volunteerButton">Volunteer as Listener</button>

    <script>
        // Function to create a chat container
        function createChatContainer(groupName) {
            var newDiv = document.createElement('div');
            newDiv.innerHTML = `
                <div class="chat-container">
                    <div class="chat-header">
                        <h1>${groupName} <i class="fas fa-comment"></i></h1>
                        <div>Members</div>
                    </div>
                    <div class="chat__item__container" id="id_chat_item_container_${groupName.replace(/\s+/g, '_')}">
                        <!-- Messages will be displayed here with a scrollbar -->
                    </div>
                    <div class="chat-input-container">
                        <input type="text" id="id_message_send_input_${groupName.replace(/\s+/g, '_')}" placeholder="Type your message..." />
                        <button type="submit" id="id_message_send_button_${groupName.replace(/\s+/g, '_')}"><i class="fas fa-paper-plane"></i> Send</button>
                    </div>
                </div>`;

            // Append the new div to the body (or any other container)
            document.body.appendChild(newDiv);
        }

        // Function to handle redirection to a specific group
        function redirectToGroup(groupName) {
            // Implement your redirection logic here, such as navigating to a specific URL
            console.log("Redirecting to group:", groupName);
        }

        document.getElementById('createButton').addEventListener('click', function() {
            var groupName = prompt("Please enter the group name");
            if (groupName == null || groupName.trim() === "") {
                alert("You must enter a group name");
                return;
            }

            // Create a new chat container
            createChatContainer(groupName);

            // Display the group name in the 'group' div
            var groupList = document.getElementById('groupList');
            var listItem = document.createElement('li');
            listItem.textContent = groupName;
            listItem.classList.add('group-item'); // Add a class for styling and event binding
            groupList.appendChild(listItem);

            // Store the group name in localStorage
            var groups = JSON.parse(localStorage.getItem('groups')) || [];
            groups.push(groupName);
            localStorage.setItem('groups', JSON.stringify(groups));
        });

        // Function to load chat containers from local storage
        function loadChatContainers() {
            var groups = JSON.parse(localStorage.getItem('groups')) || [];
            groups.forEach(function(groupName) {
                createChatContainer(groupName);
            });
        }

        // Load the groups from localStorage when the page loads
        window.addEventListener('load', function() {
            loadChatContainers();
            var groupList = document.getElementById('groupList');
            var groups = JSON.parse(localStorage.getItem('groups')) || [];
            groups.forEach(function(groupName) {
                var listItem = document.createElement('li');
                listItem.textContent = groupName;
                listItem.classList.add('group-item'); // Add a class for styling and event binding
                listItem.addEventListener('click', function() {
                    alert("You clicked on " + groupName);
                });
                groupList.appendChild(listItem);
            });
        });

        // Event listener for "Volunteer as Listener" button
        document.getElementById('volunteerButton').addEventListener('click', function() {
            var volunteerName = prompt("Please enter your name");
            if (volunteerName) {
                // Add volunteer name to the volunteer list
                var volunteeList = document.getElementById('volunteeList');
                var listItem = document.createElement('li');
                listItem.textContent = volunteerName;
                volunteeList.appendChild(listItem);

                // Store volunteer name in local storage
                var volunteers = JSON.parse(localStorage.getItem('volunteers')) || [];
                volunteers.push(volunteerName);
                localStorage.setItem('volunteers', JSON.stringify(volunteers));
            }
        });

        // Load volunteers from localStorage when the page loads
        window.addEventListener('load', function() {
            var volunteeList = document.getElementById('volunteeList');
            var volunteers = JSON.parse(localStorage.getItem('volunteers')) || [];
            volunteers.forEach(function(volunteerName) {
                var listItem = document.createElement('li');
                listItem.textContent = volunteerName;
                volunteeList.appendChild(listItem);
            });
        });
    </script>
</body>





</html>
