<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            font-family: Inter;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin-top: 0px;
            padding: 0px;
        }
        
        .chat-container {
            max-width: 80vw;
            margin: 0 auto;
            padding: 10px;
        }
        
        .chat-header {
            text-align: center;
            background-color: #8A441D;
            color: #fff;
            padding: 10px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        
        .chat-header h1 {
            font-size: 24px;
        }
        
        .chat-logout {
            text-align: right;
            padding: 10px;
        }
        
        .chat-logout a {
            text-decoration: none;
            color: #8A441D;
            font-weight: bold;
        }
        
        .chat-logout a:hover {
            text-decoration: underline;
        }
        
        .chat__item__container {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 10px;
            height: 300px;
            max-height: 300px;
            /* Set a maximum height for the chat container */
            overflow-y: auto;
            /* Add a vertical scrollbar when needed */
        }
        
        .chat-input-container {
            display: flex;
            align-items: center;
        }
        
        #id_message_send_input {
            flex: 1;
            /* Take up available space */
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        
        #id_message_send_button {
            padding: 5px 10px;
            background-color: #8A441D;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 5px;
        }
        
        .chat-message {
            background-color: #e4f9f5;
            border-radius: 10px;
            margin: 10px 0;
            padding: 10px;
            position: relative;
        }
        
        .chat-message.right {
            background-color: black;
            width: 80%;
            float: right;
            clear: both;
            margin-left: auto;
            margin-right: 0;
        }
        
        .chat-message.left {
            background-color: #8A441D;
            width: 80%;
            float: left;
            clear: both;
            margin-left: 0;
            margin-right: auto;
        }
        
        #volunteerButton,
        #createButton,
        #joinButton {
            display: inline-block;
            background-color: #8A441D;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .chat-message span {
            font-weight: bold;
            color: white;
        }
        
        .message-timestamp {
            font-size: 10px;
            position: absolute;
            top: 5px;
            right: 5px;
        }
        
        .message-username {
            font-size: 12px;
            position: absolute;
            bottom: 5px;
            right: 5px;
        }
        
        .sidenav {
            height: 100%;
            width: 200px;
            position: fixed;
            z-index: 1;
            top: 0px;
            left: 0;
            background-color: #A79589;
            overflow-x: hidden;
            padding-top: 20px;
            border-radius: 0px 20px 20px 0px;
        }
        
        .sidenav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .sidenav li {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #ccc;
            transition: background-color 0.3s ease;
        }
        
        .sidenav li:hover {
            background-color: #ccc;
        }
        
        .main {
            flex: 1;
            height: 100%;
            margin-left: 200px;
        }
        
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex: 1;
            border: 1px solid black;
            margin: 5px;
            text-align: center;
        }
        
        .container .volunteer,
        .container .groups,
        .container .chat-container {
            flex: 1;
            border: 1px solid black;
            margin: 5px;
            text-align: center;
        }
        
        .highlighted {
            background-color: black;
            /* Or any other color */
        }
        
        .group-list-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-top: 60%;
        }
        
        .chat-container {
            flex: 0 0 30%;
            margin: 1.5%;
        }
    </style>
</head>

<body>
    <button id="createButton" type="submit">Create Group</button>
    <div class="voluntee">
        <h3>Volunteers</h3>

        <button id="volunteerButton" type="submit">Volunteer as Listener</button>
        <ul id="volunteeList"></ul>
    </div>
    <div id="groupList" class="group-list-container">
        <ul id="groupList"></ul>
    </div>

    <script>
        var loggedInUser = "{{ request.user.username }}";

        document.getElementById('createButton').addEventListener('click', function() {
            var groupName = prompt("Please enter group name");
            if (groupName != null) {
                fetch('/create_chat_group/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCookie('csrftoken') // Include the CSRF token in the request header
                        },
                        body: JSON.stringify({
                            title: groupName,
                        }),
                    })
                    .then(response => response.json())
                    .then(data => {
                        // Create a new chat container and add it to the HTML
                        var newChatContainer = document.createElement('div');
                        newChatContainer.className = 'chat-container';
                        newChatContainer.style.border = '1px solid black'; // Add some basic styles to make the chat container visible
                        newChatContainer.style.margin = '5px';
                        newChatContainer.style.padding = '5px';
                        newChatContainer.innerHTML = `
            
                       
            <div class="chat-header">
                <h1>${groupName} <i class="fas fa-comment"></i></h1>
            </div>
            <!-- Rest of the chat container HTML -->
            <div class="chat__item__container" id="id_chat_item_container">
                <!-- Messages will be displayed here with a scrollbar -->
            </div>
            <div class="chat-input-container">
                <input type="text" id="id_message_send_input" placeholder="Type your message..." />
                <button type="submit" class="message_send_button"><i class="fas fa-paper-plane"></i> Send</button>
            </div>
            
        `;

                        // Attach event listeners to the send button and input field of the new chat group
                        newChatContainer.querySelector('.message_send_button').addEventListener('click', function() {
                            var messageInput = this.parentElement.querySelector('.message_send_input').value;
                            // Send the message...
                        });
                        newChatContainer.querySelector('.message_send_input').addEventListener('keyup', function(e) {
                            if (e.keyCode == 13) {
                                this.parentElement.querySelector('.message_send_button').click();
                            }
                        });
                        document.getElementById('groupList').appendChild(newChatContainer); // Append chat container to group list

                        // Create a WebSocket connection for the new group
                        const chatSocket = new WebSocket(`ws://${window.location.host}/ws/chat/${groupName}/`);
                    });
            }

        });

        // Function to fetch and display groups
        function fetchAndDisplayGroups() {
            fetch('/get_chat_groups/', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                })
                .then(response => response.json())
                .then(data => {
                    // Clear the group list
                    var groupList = document.getElementById('groupList');
                    groupList.innerHTML = '';

                    // Create a new chat container for each group and add it to the HTML
                    data.forEach(group => {
                        var newChatContainer = document.createElement('div');
                        newChatContainer.className = 'chat-container';
                        newChatContainer.style.border = '1px solid black'; // Add some basic styles to make the chat container visible
                        newChatContainer.style.margin = '5px';
                        newChatContainer.style.padding = '5px';
                        newChatContainer.innerHTML = `
            <div class="chat-header">
                <h1>${group.title} <i class="fas fa-comment"></i></h1>
                <p>Members: ${group.members.join(', ')}</p> 
            </div>
            <button class="join-group" data-group-id="${group.id}">Join Group</button>
            <!-- Rest of the chat container HTML -->
            <div class="chat__item__container" id="id_chat_item_container">
                <!-- Messages will be displayed here with a scrollbar -->
            </div>
            <div class="chat-input-container">
                <input type="text" id="id_message_send_input" placeholder="Type your message..." />
                <button type="submit" id="id_message_send_button"><i class="fas fa-paper-plane"></i> Send</button>
            </div>
        `;
                        groupList.appendChild(newChatContainer); // Append chat container to group list

                        // Add an event listener to the "Join Group" button
                        newChatContainer.querySelector('.join-group').addEventListener('click', function() {
                            fetch('/join_chat_group/', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json',
                                        'X-CSRFToken': getCookie('csrftoken') // Include the CSRF token in the request header
                                    },
                                    body: JSON.stringify({
                                        group_id: this.dataset.groupId, // Send the group ID in the POST data
                                    }),
                                })
                                .then(response => response.json())
                                .then(data => {
                                    // Update the list of members
                                    this.previousElementSibling.querySelector('p').textContent = `Members: ${data.members.join(', ')}`;
                                });
                        });
                    });
                });

        }
        // Call the function when the page loads
        window.onload = fetchAndDisplayGroups;

        // Function to get a cookie by name
        function getCookie(name) {
            var cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                var cookies = document.cookie.split(';');
                for (var i = 0; i < cookies.length; i++) {
                    var cookie = cookies[i].trim();
                    // Does this cookie string begin with the name we want?
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        document.getElementById('volunteerButton').addEventListener('click', function() {
            var volunteerName = loggedInUser;

            // Send a POST request to the server to create a new volunteer
            fetch('/volunteers/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    user: volunteerName
                })
            }).then(function(response) {
                if (response.ok) {
                    alert("Volunteered successfully");
                } else {
                    alert("Failed to volunteer");
                }
            });
        });

        // Fetch volunteers
        fetch('/volunteers/')
            .then(response => response.json())
            .then(volunteers => {
                const volunteerList = document.getElementById('volunteeList');
                volunteers.forEach(volunteer => {
                    const li = document.createElement('li');
                    li.textContent = volunteer.user__username; // Change this line
                    volunteerList.appendChild(li);
                });
            });

        const chatSocket = new WebSocket("ws://" + window.location.host + "/");
        chatSocket.onopen = function(e) {
            console.log("The connection was set up successfully!");
        };
        chatSocket.onclose = function(e) {
            console.log("Something unexpected happened!");
        };
        document.querySelector("#id_message_send_input").focus();
        document.querySelector("#id_message_send_input").onkeyup = function(e) {
            if (e.keyCode == 13) {
                document.querySelector("#id_message_send_button").click();
            }
        };
        document.querySelector("#id_message_send_button").onclick = function(e) {
            var messageInput = document.querySelector("#id_message_send_input").value;
            var currentTime = new Date();
            var time = currentTime.toLocaleTimeString();
            chatSocket.send(JSON.stringify({
                message: messageInput,
                username: "{{request.user.username}}",
                time: time
            }));
        };
        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            var messageContainer = document.querySelector("#id_chat_item_container");
            var div = document.createElement("div");
            div.className = (data.username === "{{request.user.username}}") ? "chat-message right" : "chat-message left";
            div.innerHTML = `<div class="message-content">
                <span class="message-username">${data.username.charAt(0).toUpperCase() + data.username.slice(1)}</span>
                <span class="message-text">${data.message}</span>
                <span class="message-timestamp">${data.time}</span>
            </div>`;
            document.querySelector("#id_message_send_input").value = "";
            messageContainer.appendChild(div);
            // Scroll to the bottom of the chat container
            messageContainer.scrollTop = messageContainer.scrollHeight;
        };
    </script>
</body>

</html>
