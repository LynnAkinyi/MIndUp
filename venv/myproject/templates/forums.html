<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            font-family: Inter;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        .chat-container {
            max-width: 80vw;
            margin: 0 auto;
            padding: 10px;
        }
        
        .chat-header {
            text-align: center;
            background-color: #8A441D;
            color: #fff;
            padding: 10px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        
        .chat-header h1 {
            font-size: 24px;
        }
        
        .chat-logout {
            text-align: right;
            padding: 10px;
        }
        
        .chat-logout a {
            text-decoration: none;
            color: #8A441D;
            font-weight: bold;
        }
        
        .chat-logout a:hover {
            text-decoration: underline;
        }
        
        .chat__item__container {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 10px;
            height: 300px;
            max-height: 300px;
            /* Set a maximum height for the chat container */
            overflow-y: auto;
            /* Add a vertical scrollbar when needed */
        }
        
        .chat-input-container {
            display: flex;
            align-items: center;
        }
        
        #id_message_send_input {
            flex: 1;
            /* Take up available space */
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        
        #id_message_send_button {
            padding: 5px 10px;
            background-color: #8A441D;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 5px;
        }
        
        .chat-message {
            background-color: #e4f9f5;
            border-radius: 10px;
            margin: 10px 0;
            padding: 10px;
            position: relative;
        }
        
        .chat-message.right {
            background-color: black;
            width: 80%;
            float: right;
            clear: both;
            margin-left: auto;
            margin-right: 0;
        }
        
        .chat-message.left {
            background-color: #8A441D;
            width: 80%;
            float: left;
            clear: both;
            margin-left: 0;
            margin-right: auto;
        }
        
        #volunteerButton,
        #createButton,
        #joinButton {
            display: inline-block;
            background-color: #8A441D;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .chat-message span {
            font-weight: bold;
            color: white;
        }
        
        .message-timestamp {
            font-size: 10px;
            position: absolute;
            top: 5px;
            right: 5px;
        }
        
        .message-username {
            font-size: 12px;
            position: absolute;
            bottom: 5px;
            right: 5px;
        }
        
        .sidenav {
            height: 100%;
            width: 200px;
            position: fixed;
            z-index: 1;
            top: 0px;
            left: 0;
            background-color: #A79589;
            overflow-x: hidden;
            padding-top: 20px;
            border-radius: 0px 20px 20px 0px;
        }
        
        .sidenav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .sidenav li {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #ccc;
            transition: background-color 0.3s ease;
        }
        
        .sidenav li:hover {
            background-color: #ccc;
        }
        
        .main {
            flex: 1;
            height: 100%;
            margin-left: 200px;
        }
        
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex: 1;
            border: 1px solid black;
            margin: 5px;
            text-align: center;
        }
        
        .container .volunteer,
        .container .groups,
        .container .chat-container {
            flex: 1;
            border: 1px solid black;
            margin: 5px;
            text-align: center;
        }
        
        .highlighted {
            background-color: black;
            /* Or any other color */
        }
    </style>
</head>

<body>
    <div class="group">
        <ul id="groupList">
            <h3>Groups</h3>
            <button id="joinButton" type="submit">Join Group</button>
        </ul>

        <ul id="members">

        </ul>
    </div>

    <div class="voluntee">
        <h3>Volunteers</h3>
        <ul id="volunteeList"></ul>
        <button id="createButton" type="submit">Create Group</button>
    </div>
    <button id="volunteerButton" type="submit">Volunteer as Listener</button>


    <div class="chat-container">
        <div class="chat-header">
            <h1>Tranquil Mind <i class="fas fa-comment"></i></h1>
        </div>

        <div class="chat__item__container" id="id_chat_item_container">
            <!-- Messages will be displayed here with a scrollbar -->
        </div>
        <div class="chat-input-container">
            <input type="text" id="id_message_send_input" placeholder="Type your message..." />
            <button type="submit" id="id_message_send_button"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
    </div>
    <script>
        var loggedInUser = "{{ request.user.username }}";

        document.getElementById('createButton').addEventListener('click', function() {
            var groupName = prompt("Please enter the group name");
            if (groupName == null || groupName.trim() === "") {
                alert("You must enter a group name");
                return;
            }

            // Send a POST request to the server to create a new group
            fetch('/groups/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    name: groupName,
                    created_by: loggedInUser
                })
            }).then(function(response) {
                if (response.ok) {
                    alert("Group created successfully");
                } else {
                    alert("Failed to create group");
                }
            });
        });

        document.getElementById('volunteerButton').addEventListener('click', function() {
            var volunteerName = loggedInUser;

            // Send a POST request to the server to create a new volunteer
            fetch('/volunteers/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    user: volunteerName
                })
            }).then(function(response) {
                if (response.ok) {
                    alert("Volunteered successfully");
                } else {
                    alert("Failed to volunteer");
                }
            });
        });


        // Fetch groups
        fetch('/groups/')
            .then(response => response.json())
            .then(groups => {
                const groupList = document.getElementById('groupList');
                groups.forEach(group => {
                    const li = document.createElement('li');
                    li.textContent = group.name;
                    groupList.appendChild(li);
                });
            });

        // Fetch volunteers
        fetch('/volunteers/')
            .then(response => response.json())
            .then(volunteers => {
                const volunteerList = document.getElementById('volunteeList');
                volunteers.forEach(volunteer => {
                    const li = document.createElement('li');
                    li.textContent = volunteer.user__username; // Change this line
                    volunteerList.appendChild(li);
                });
            });

        document.getElementById('joinButton').addEventListener('click', function() {
            var groupName = prompt("Please enter the name of the group you want to join");
            if (groupName == null || groupName.trim() === "") {
                alert("You must enter a group name");
                return;
            }

            // Send a POST request to the server to add the user to the group
            fetch('/groups/join/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    group_name: groupName,
                    user: loggedInUser
                })
            }).then(function(response) {
                if (response.ok) {
                    // Add the user to the members list in the HTML
                    const membersList = document.getElementById('members');
                    const li = document.createElement('li');
                    li.textContent = loggedInUser;
                    membersList.appendChild(li);

                    alert("Joined group successfully");
                } else {
                    alert("Failed to join group");
                }
            });
        });

        // Fetch groups
        fetch('/groups/')
            .then(response => response.json())
            .then(groups => {
                groups.forEach(group => {
                    // Fetch members for each group
                    fetch('/groups/get_members/' + encodeURIComponent(group.name))
                        .then(response => response.json())
                        .then(members => {
                            const membersList = document.getElementById('members');
                            members.forEach(member => {
                                const li = document.createElement('li');
                                li.textContent = member.username;
                                membersList.appendChild(li);
                            });
                        });
                });
            });

        // Fetch groups and members
        fetch('/groups_and_members/')
            .then(response => response.json())
            .then(groups_and_members => {
                groups_and_members.forEach(group_and_members => {
                    const groupList = document.getElementById('groupList');
                    const li = document.createElement('li');

                    // Create a heading for the group name
                    const groupHeading = document.createElement('h3');
                    groupHeading.textContent = group_and_members.group;
                    li.appendChild(groupHeading);

                    // Create a heading for the members list
                    const membersHeading = document.createElement('p');
                    membersHeading.textContent = 'Members';
                    li.appendChild(membersHeading);

                    const membersList = document.createElement('ul');
                    group_and_members.members.forEach(member => {
                        const li = document.createElement('li');
                        li.textContent = member.username;
                        membersList.appendChild(li);
                    });

                    // Append the members list to the group list item
                    li.appendChild(membersList);

                    // Append the list item to the group list
                    groupList.appendChild(li);
                });
            });
    </script>
</body>

</html>
