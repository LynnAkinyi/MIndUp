<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Example</title>
</head>

<body>
    <h1>Search Example</h1>
    <input type="text" id="searchInput" placeholder="Enter search query...">
    <button onclick="search()">Search</button>
    <div id="searchResults"></div>

    <script>
        function search() {
            // Get the search query from the input field
            var query = document.getElementById('searchInput').value.trim().toLowerCase();

            // Get the content to search (e.g., list items, paragraphs, etc.)
            var contentToSearch = document.querySelectorAll('.searchable');

            // Clear previous search results
            document.getElementById('searchResults').innerHTML = '';

            // Loop through each content item and check if it matches the search query
            contentToSearch.forEach(function(item) {
                var textContent = item.textContent.toLowerCase();
                if (textContent.includes(query)) {
                    // If the item matches the search query, display it in the search results
                    var resultItem = document.createElement('div');
                    resultItem.textContent = item.textContent;
                    document.getElementById('searchResults').appendChild(resultItem);
                }
            });

            // Provide feedback if no results were found
            if (document.getElementById('searchResults').children.length === 0) {
                var noResultsMessage = document.createElement('div');
                noResultsMessage.textContent = 'No results found.';
                document.getElementById('searchResults').appendChild(noResultsMessage);
            }
        }
    </script>

    <!-- Example content to search -->
    <ul>
        <li class="searchable">Item 1: Lorem ipsum dolor sit amet</li>
        <li class="searchable">Item 2: consectetur adipiscing elit</li>
        <li class="searchable">Item 3: sed do eiusmod tempor incididunt</li>
    </ul>

</body>

</html>
