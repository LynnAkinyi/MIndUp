<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            font-family: Inter;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .chat-container {
            max-width: 80vw;
            margin: 0 auto;
            padding: 10px;
        }
        
        .chat-header {
            text-align: center;
            background-color: #8A441D;
            color: #fff;
            padding: 10px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        
        .chat-header h1 {
            font-size: 24px;
        }
        
        .chat-logout {
            text-align: right;
            padding: 10px;
        }
        
        .chat-logout a {
            text-decoration: none;
            color: #8A441D;
            font-weight: bold;
        }
        
        .chat-logout a:hover {
            text-decoration: underline;
        }
        
        .chat__item__container {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 10px;
            height: 300px;
            max-height: 300px;
            /* Set a maximum height for the chat container */
            overflow-y: auto;
            /* Add a vertical scrollbar when needed */
        }
        
        .chat-input-container {
            display: flex;
            align-items: center;
        }
        
        #id_message_send_input {
            flex: 1;
            /* Take up available space */
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        
        #id_message_send_button {
            padding: 5px 10px;
            background-color: #8A441D;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 5px;
        }
        
        .chat-message {
            background-color: #e4f9f5;
            border-radius: 10px;
            margin: 10px 0;
            padding: 10px;
            position: relative;
        }
        
        .chat-message.right {
            background-color: black;
            width: 80%;
            float: right;
            clear: both;
            margin-left: auto;
            margin-right: 0;
        }
        
        .chat-message.left {
            background-color: #8A441D;
            width: 80%;
            float: left;
            clear: both;
            margin-left: 0;
            margin-right: auto;
        }
        
        #volunteerButton,
        #createButton,
        #joinButton {
            display: inline-block;
            background-color: #8A441D;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .chat-message span {
            font-weight: bold;
            color: white;
        }
        
        .message-timestamp {
            font-size: 10px;
            position: absolute;
            top: 5px;
            right: 5px;
        }
        
        .message-username {
            font-size: 12px;
            position: absolute;
            bottom: 5px;
            right: 5px;
        }
        
        .sidenav {
            height: 100%;
            width: 200px;
            position: fixed;
            z-index: 1;
            top: 0px;
            left: 0;
            background-color: #A79589;
            overflow-x: hidden;
            padding-top: 20px;
            border-radius: 0px 20px 20px 0px;
        }
        
        .sidenav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .sidenav li {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #ccc;
            transition: background-color 0.3s ease;
        }
        
        .sidenav li:hover {
            background-color: #ccc;
        }
        
        .main {
            flex: 1;
            height: 100%;
            margin-left: 200px;
        }
        
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex: 1;
            border: 1px solid black;
            margin: 5px;
            text-align: center;
        }
        
        .container .volunteer,
        .container .groups,
        .container .chat-container {
            flex: 1;
            border: 1px solid black;
            margin: 5px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="groups"><i>Groups</i><br>
        <button id="createButton" style="display: none;">Create Group</button>
        <button id="joinButton" style="display: none;">Join Group</button>
        <div id="newDivContainer"></div>

    </div>

    <div class="main">

        <div id="groupContainer"></div>
        <div class="group"></div>
        <div class="container">
            <div id="volunteerDiv" style="display: none;" class="volunteer"><i>Volunteer</i>
                <br>
                <button id="volunteerButton">Volunteer as Listener</button>
                <div id="volunteerNames"></div>
            </div>


            <div class="chat-container">
                <div class="chat-header">
                    <h1>Tranquil Mind <i class="fas fa-comment"></i></h1>
                </div>

                <div class="chat__item__container" id="id_chat_item_container">
                    <!-- Messages will be displayed here with a scrollbar -->
                </div>
                <div class="chat-input-container">
                    <input type="text" id="id_message_send_input" placeholder="Type your message..." />
                    <button type="submit" id="id_message_send_button"><i class="fas fa-paper-plane"></i> Send</button>
                </div>
            </div>

        </div>

    </div>
    <script>
        // Retrieve the messages from localStorage
        var messages = JSON.parse(localStorage.getItem('messages')) || [];
        var messageContainer = document.querySelector("#id_chat_item_container");

        // Display each message
        messages.forEach(function(message) {
            var div = document.createElement("div");
            div.className = (message.username === "{{request.user.username}}") ? "chat-message right" : "chat-message left";
            div.innerHTML = `
            <div class="message-content">
                <span class="message-username">${message.username.charAt(0).toUpperCase() + message.username.slice(1)}</span>
                <span class="message-text">${message.message}</span>
                <span class="message-timestamp">${message.time}</span>
            </div>`;
            messageContainer.appendChild(div);
        });

        const chatSocket = new WebSocket("ws://" + window.location.host + "/");
        chatSocket.onopen = function(e) {
            console.log("The connection was set up successfully!");
        };
        chatSocket.onclose = function(e) {
            console.log("Something unexpected happened!");
        };

        document.querySelector("#id_message_send_input").focus();
        document.querySelector("#id_message_send_input").onkeyup = function(e) {
            if (e.keyCode == 13) {
                document.querySelector("#id_message_send_button").click();
            }
        };

        document.querySelector("#id_message_send_button").onclick = function(e) {
            var messageInput = document.querySelector("#id_message_send_input").value;
            var currentTime = new Date();
            var time = currentTime.toLocaleTimeString();
            chatSocket.send(JSON.stringify({
                message: messageInput,
                username: "{{request.user.username}}",
                time: time
            }));

            // Store the message in localStorage
            var messages = JSON.parse(localStorage.getItem('messages')) || [];
            messages.push({
                message: messageInput,
                username: "{{request.user.username}}",
                time: time
            });
            localStorage.setItem('messages', JSON.stringify(messages));
        };

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            var messageContainer = document.querySelector("#id_chat_item_container");
            var div = document.createElement("div");
            div.className = (data.username === "{{request.user.username}}") ? "chat-message right" : "chat-message left";
            div.innerHTML = `
            <div class="message-content">
                <span class="message-username">${data.username.charAt(0).toUpperCase() + data.username.slice(1)}</span>
                <span class="message-text">${data.message}</span>
                <span class="message-timestamp">${data.time}</span>
            </div>`;
            document.querySelector("#id_message_send_input").value = "";
            messageContainer.appendChild(div);

            // Scroll to the bottom of the chat container
            messageContainer.scrollTop = messageContainer.scrollHeight;
        };

        var role = "{{ role }}";
        var username = "{{ user.username }}";
        if (role === "therapist") {
            document.getElementById('createButton').style.display = 'block';
        } else if (role === "member") {
            document.getElementById('joinButton').style.display = 'block';
            document.getElementById('volunteerDiv').style.display = 'block';
            document.getElementById('volunteerButton').addEventListener('click', function() {
                var volunteerNamesDiv = document.getElementById('volunteerNames');
                volunteerNamesDiv.innerHTML = username + "<br>";
            });
        }

        // Attach multiple event listeners to the 'load' event
        window.addEventListener('load', function() {
            // Retrieve the saved groups from local storage and display each group
            var groups = retrieveGroups();
            groups.forEach(function(groupName) {
                displayGroup(groupName);
            });

            // Retrieve the messages from local storage and display each message
            var messages = JSON.parse(localStorage.getItem('messages')) || [];
            var messageContainer = document.querySelector("#id_chat_item_container");
            messages.forEach(function(message) {
                var div = document.createElement("div");
                div.className = (message.username === "{{request.user.username}}") ? "chat-message right" : "chat-message left";
                div.innerHTML = `
                <div class="message-content">
                    <span class="message-username">${message.username.charAt(0).toUpperCase() + message.username.slice(1)}</span>
                    <span class="message-text">${message.message}</span>
                    <span class="message-timestamp">${message.time}</span>
                </div>`;
                messageContainer.appendChild(div);
            });
        });

        document.getElementById('createButton').addEventListener('click', function() {
            var groupName = prompt("Please enter the group name");
            if (groupName == null || groupName.trim() === "") {
                alert("You must enter a group name");
                return;
            }

            // Create a new div
            var newDiv = document.createElement('group');
            newDiv.textContent = groupName;

            // Append the new div to the body (or any other container)
            document.body.appendChild(newDiv);
        });
    </script>

</body>

</html>
