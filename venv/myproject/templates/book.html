<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* styles.css */
        /* Header styling */
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        header {
            text-align: center;
            padding: 20px;
            margin-top: 100px;
        }
        
        .book {
            width: 60vw;
            height: 100vh;
            display: flex;
            margin: 20vw;
            border-radius: 10px;
            flex-direction: column;
            justify-content: center;
            background-color: rgba(232, 194, 168, 0.2);
        }
        
        header img {
            border-radius: 50%;
            max-width: 150px;
        }
        /* Availability section styling */
        
        .availability {
            margin: 20px;
        }
        /* About section styling */
        
        .about {
            padding: 20px;
            background-color: #f9f9f9;
        }
        /* Ratings section styling */
        
        .ratings {
            margin: 20px;
        }
        
        .review {
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
        }
        /* Charges section styling */
        
        .charges {
            padding: 20px;
            background-color: #f9f9f9;
        }
        
        .styled-input {
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .styled-button {
            background-color: #8A441D;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .selected-dates {
            margin-top: 20px;
            background-color: #8A441D;
        }
    </style>
    <!-- Link to your CSS file -->
    <title>Therapist Profile</title>
</head>

<body>
    <div class="book">
        <header>
            <img id="therapistImage" src="" alt="Therapist Image">
            <h1 id="therapistName"></h1>
            <p id="therapistRole">{{ therapist.role }}</p>
            <p id="therapistSpecialty">{{ therapist.specialty }}</p>
            <p id="therapistEmail">{{ therapist.email }}</p>
        </header>

        <section class="availability">
            <!-- Calendar or schedule goes here -->
            <!-- Example: -->
            <div class="calendar">
                <!-- Calendar content -->
            </div>
        </section>

        <section class="about">
            <h2>About Me</h2>
            <p>With over 10 years of experience...</p>
        </section>

        <section class="ratings">
            <!-- Ratings and reviews go here -->
            <!-- Example: -->
            <div class="review">
                <p>⭐️⭐️⭐️⭐️⭐️</p>
                <p id="therapistReview"></p>
            </div>
            <!-- Repeat for other reviews -->
        </section>

        <section class="charges">
            <h2>Charges</h2>
            <p>Initial consultation: $150</p>
            <p>Follow-up sessions: $100</p>
            <form action="">
                <form action="">
                    <input type="date" id="appointmentDate" class="styled-input">
                    <button class="styled-button" id="scheduleButton">Schedule</button>
                </form>
            </form>
        </section>

        <section class="appointments">
            <h2>Scheduled Appointments</h2>
            <ul id="scheduledAppointmentsList"></ul>
        </section>
    </div>
    <script>
        document.getElementById("scheduleButton").addEventListener('click', function(event) {
            event.preventDefault(); // Prevent form submission

            const selectedDate = document.getElementById('appointmentDate').value;
            if (selectedDate) {
                let selectedDates = JSON.parse(localStorage.getItem('selectedDates')) || [];
                selectedDates.push(selectedDate);
                localStorage.setItem('selectedDates', JSON.stringify(selectedDates));

                // Display a success message or modal
                alert('Appointment scheduled successfully!');
                window.location.replace("{% url 'dashboard' %}");
            }
        });

        window.onload = function() {
            // Retrieve the selected therapist's image URL, name, and role from localStorage
            var imageUrl = localStorage.getItem('selectedTherapistImageUrl');
            var therapistName = localStorage.getItem('selectedTherapistName');
            var therapistRole = localStorage.getItem('selectedTherapistRole');
            var therapistSpecialty = localStorage.getItem('selectedTherapistSpecialty');
            var therapistEmail = localStorage.getItem('selectedTherapistEmail');
            var therapistId = localStorage.getItem('selectedTherapistId');

            // Update the src attribute of the img element with the selected therapist's image URL
            document.getElementById('therapistImage').src = imageUrl;
            // Update the text content of the h1 element with the selected therapist's name
            document.getElementById('therapistName').textContent = therapistName;
            // Update the text content of the p element with the selected therapist's role
            document.getElementById('therapistRole').textContent = therapistRole;
            // Update the text content of the p element with the selected therapist's specialty
            document.getElementById('therapistSpecialty').textContent = therapistSpecialty;
            // Update the text content of the p element with the selected therapist's email
            document.getElementById('therapistEmail').textContent = therapistEmail;
            // Update the text content of the p element with the selected therapist's review
            document.getElementById('therapistReview').textContent = `${therapistName} is amazing!`;

            var therapistId = localStorage.getItem('selectedTherapistId');
            // ...

            // Filter the appointments to only include those associated with the selected therapist
            var therapistAppointments = appointments.filter(function(appointment) {
                return appointment.therapistId === therapistId;
            });

            // Retrieve the appointments from localStorage
            var appointments = JSON.parse(localStorage.getItem('appointments')) || [];

            // Filter the appointments to only include those associated with the selected therapist
            var therapistAppointments = appointments.filter(function(appointment) {
                return appointment.therapistId === therapistName;
            });

            // Display the therapist's appointments in the "scheduledAppointmentsList" element
            var scheduledAppointmentsListElement = document.getElementById('scheduledAppointmentsList');
            therapistAppointments.forEach(function(appointment) {
                var listItem = document.createElement('li');
                listItem.textContent = appointment.date;
                scheduledAppointmentsListElement.appendChild(listItem);
            });

            // Check if the user is a member
            var isMember = "{{ user.profile.role }}" === "member";

            // Hide the scheduled appointments section for members
            if (isMember) {
                document.querySelector('.appointments').style.display = 'none';
            }
        }
    </script>
</body>

</html>
