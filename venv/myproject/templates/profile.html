<form method="POST" action="{% url 'profile' %}" enctype="multipart/form-data" style="width: 300px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 4px;">
    {% csrf_token %} {{ form.as_p }}
    <button style="background-color: #8a4c1d; color: white; padding: 10px 20px; margin: 10px 0; border: none; cursor: pointer; border-radius:20px;">Save details</button>
    <button type="button" style="background-color: #351a06; color: white; padding: 10px 20px; margin: 10px 0; border: none; cursor: pointer; border-radius:20px;" onclick="confirmDelete()">Edit</button>
</form>



{% if role_picked %}
<script>
    alert("You've already picked a role.");
</script>
{% endif %}
