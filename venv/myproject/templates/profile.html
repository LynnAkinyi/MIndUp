{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        body {
            background-color: #f0f0f0;
            /* Change this to your preferred color */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .container {
            text-align: center;
            background-color: #fff;
            /* Change this to your preferred color */
            padding: 50px;
            border-radius: 10px;
            width: 400px;
        }
        
        .input-group {
            margin-bottom: 10px;
        }
        
        .saved-info {
            display: none;
        }
        
        #selected-image {
            display: none;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>{{ request.user.username }}'s Profile</h1>

        <!-- Personal Information Section -->
        <div class="section">
            <h2 class="section-title">Personal Information</h2>
            <div class="input-group">
                <label for="profile-picture">Profile Picture:</label>
                <input type="file" id="profile-picture" name="profile-picture" accept="image/*" onchange="displaySelectedImage()">
            </div>
            <img id="selected-image" src="#" alt="Selected image" style="display: none;" />
            <div class="input-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </div>
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="input-group">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">
            </div>
            <div class="input-group">
                <p>Role:</p>
                <input type="radio" id="therapist" name="role" value="therapist">
                <label for="therapist">Therapist</label><br>
                <input type="radio" id="member" name="role" value="member">
                <label for="member">Member</label><br>
            </div>

            <div class="saved-info">
                <p><strong>Profile Picture:</strong> <img id="saved-profile-picture" src="" alt="Profile Picture"></p>
                <p><strong>Name:</strong> <span id="saved-name"></span></p>
                <p><strong>Email:</strong> <span id="saved-email"></span></p>
                <p><strong>Phone:</strong> <span id="saved-phone"></span></p>
                <p><strong>Role:</strong> <span id="saved-role"></span></p>

            </div>
        </div>

        <!-- Save/Edit Button -->
        <button class="btn" id="save-btn" onclick="saveProfile()">Save</button>


    </div>

    <script>
        function saveProfile() {
            // Get input values
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const role = document.querySelector('input[name="role"]:checked').value;
            const profilePicture = localStorage.getItem('profilePicture'); // Retrieve the profile picture from local storage

            // Store values in local storage
            const userData = {
                name: name,
                email: email,
                phone: phone,
                role: role,
                profilePicture: profilePicture // Save the profile picture
            };
            localStorage.setItem('userProfile', JSON.stringify(userData));

            // Redirect to dashboard page
            window.location.replace("{% url 'dashboard' %}");

            // Display saved information
            document.getElementById('saved-name').textContent = name;
            document.getElementById('saved-email').textContent = email;
            document.getElementById('saved-phone').textContent = phone;

            // Display the uploaded profile picture
            function displaySelectedImage() {
                const profilePicture = document.getElementById('profile-picture').files[0];
                const reader = new FileReader();

                reader.onloadend = function() {
                    const selectedImage = document.getElementById('selected-image');
                    selectedImage.src = reader.result;
                    selectedImage.style.display = 'block';

                    // Replace the icon in the dashboard with the chosen image
                    const profileLink = document.getElementById('profile-link');
                    profileLink.innerHTML = `<img src="${reader.result}" alt="Profile picture" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover;">`;

                    // Save the image in local storage
                    localStorage.setItem('profilePicture', reader.result);
                }

                if (profilePicture) {
                    reader.readAsDataURL(profilePicture);
                }
            }

            // Hide input fields and show saved information
            const inputGroups = document.querySelectorAll('.input-group');
            inputGroups.forEach(group => group.style.display = 'none');
            document.querySelector('.saved-info').style.display = 'block';

            // Change button text to "Edit"
            document.getElementById('save-btn').textContent = 'Edit';
            document.getElementById('save-btn').onclick = editProfile;

            alert('Profile saved successfully!');
        }


        function editProfile() {
            // Show input fields and hide saved information
            const inputGroups = document.querySelectorAll('.input-group');
            inputGroups.forEach(group => group.style.display = 'block');
            document.querySelector('.saved-info').style.display = 'none';

            // Change button text to "Save"
            document.getElementById('save-btn').textContent = 'Save';
            document.getElementById('save-btn').onclick = saveProfile;
        }

        // Check if values exist in local storage and display them
        window.addEventListener('load', () => {
            const userProfile = JSON.parse(localStorage.getItem('userProfile'));

            if (userProfile && userProfile.name && userProfile.email && userProfile.phone && userProfile.role) {
                document.getElementById('saved-name').textContent = userProfile.name;
                document.getElementById('saved-email').textContent = userProfile.email;
                document.getElementById('saved-phone').textContent = userProfile.phone;
                document.getElementById('saved-role').textContent = userProfile.role;

                const inputGroups = document.querySelectorAll('.input-group');
                inputGroups.forEach(group => group.style.display = 'none');
                document.querySelector('.saved-info').style.display = 'block';

                // Change button text to "Edit"
                document.getElementById('save-btn').textContent = 'Edit';
                document.getElementById('save-btn').onclick = editProfile;
            }
        });
    </script>
</body>

</html>
